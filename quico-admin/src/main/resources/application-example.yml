# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://127.0.0.1:3306/starrail_helper?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
                username: your_username
                password: your_password
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url:
                username:
                password:
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: quico
                login-password: your_password
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
    data:
        # redis 配置
        redis:
            # 地址
            host: 127.0.0.1
            # 端口，默认为6379
            port: 6379
            # 数据库索引
            database: 0
            # 密码
            password: your_password
            # 连接超时时间
            timeout: 3000ms
            jedis:
                pool:
                    # 连接池中的最小空闲连接
                    min-idle: 5
                    # 连接池中的最大空闲连接
                    max-idle: 20
                    # 连接池的最大数据库连接数
                    max-active: 50
                    # #连接池最大阻塞等待时间（使用负值表示没有限制）
                    max-wait: -1ms
        # 邮件推送（阿里云邮件推送 DirectMail）
    mail:
        # 阿里云控制台配置的自定义发信地址，需与 mail.smtp.from 一致
        username: ${ALIYUN_MAIL_USERNAME:}
        # 该发信地址的 SMTP 密码（非 AccessKey），生产环境改用环境变量注入
        password: ${ALIYUN_MAIL_PASSWORD:}

sms:
    tencent:
        secret-id: ${TENCENT_SMS_SECRET_ID:} # API 密钥 SecretId
        secret-key: ${TENCENT_SMS_SECRET_KEY:} # API 密钥 SecretKey
        sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:} # 短信应用 SdkAppId
        sign-name: ${TENCENT_SMS_SIGN_NAME:} # 短信签名内容
        template-id: ${TENCENT_SMS_TEMPLATE_ID:} # 短信模板 ID，模板变量两个：验证码、有效期分钟数
        region: ${TENCENT_SMS_REGION:ap-nanjing} # 短信接口地域

# 微信小程序配置
wechat:
    miniapp:
        appid: ${WECHAT_MINIAPP_APPID:} #小程序appid
        secret: ${WECHAT_MINIAPP_SECRET:} #小程序密钥
        mchid: ${WECHAT_MINIAPP_MCHID:} #商户号
